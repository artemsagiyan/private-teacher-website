services:
  postgres:
    image: postgres:16-alpine
    container_name: tutor_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tutor_platform
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: tutor_backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: tutor_platform
      JWT_SECRET: dev-secret-change-in-production-1234567890
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-prod-abc
      JWT_REFRESH_EXPIRES_IN: 7d
      GOOGLE_CLIENT_ID: placeholder
      GOOGLE_CLIENT_SECRET: placeholder
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/auth/google/callback
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM: noreply@tutor-platform.com
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: development
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret1234567890abcdef
      LIVEKIT_URL: ws://livekit:7880
    ports:
      - '3001:3001'
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_LIVEKIT_URL: ws://localhost:7880
    container_name: tutor_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_LIVEKIT_URL: ws://localhost:7880
    ports:
      - '3000:3000'
    depends_on:
      - backend
      - livekit

  livekit:
    image: livekit/livekit-server:latest
    container_name: tutor_livekit
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    command: --dev --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: 'devkey: devsecret1234567890abcdef'

volumes:
  postgres_data:

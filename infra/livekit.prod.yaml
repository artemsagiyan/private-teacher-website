# Generated/used by deploy/deploy.sh for production LiveKit.
# use_external_ip helps WebRTC behind a public VPS IP.

port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
  stun_servers:
    - stun:stun.l.google.com:19302

# Embedded TURN for clients behind symmetric / corporate NAT.
# UDP 3478 must be open on the host (see deploy/docker-compose.prod.yml).
turn:
  enabled: true
  domain: live.easyphys.ru
  udp_port: 3478

redis:
  address: redis:6379

keys:
  # Overridden at deploy time to match JWT/LiveKit secrets in deploy/.env.prod
  PLACEHOLDER_KEY: PLACEHOLDER_SECRET

webhook:
  api_key: PLACEHOLDER_KEY
  urls:
    - http://backend:3001/api/lessons/livekit-webhook

room:
  empty_timeout: 1800
  departure_timeout: 1800

# Production overrides for TutorPlatform on a shared VPS.
# Usage:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml \
#     --env-file deploy/.env.prod up -d --build

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - '127.0.0.1:5433:5432'

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - '127.0.0.1:9010:9000'
      - '127.0.0.1:9011:9001'

  minio-init:
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set tutor http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" &&
        mc mb --ignore-existing tutor/tutor-files

  backend:
    environment:
      NODE_ENV: production
      FRONTEND_URL: ${PUBLIC_URL}
      GOOGLE_CALLBACK_URL: ${PUBLIC_URL}/api/auth/google/callback
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: ws://livekit:7880
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@easyphys.ru}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    ports:
      # Host :3001 is used by ekaterina-math.ru — bind backend to 3010
      - '127.0.0.1:3010:3001'

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_LIVEKIT_URL: ${PUBLIC_LIVEKIT_URL}
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
      NEXT_PUBLIC_LIVEKIT_URL: ${PUBLIC_LIVEKIT_URL}
    ports:
      - '127.0.0.1:3000:3000'

  livekit:
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    volumes:
      - ./infra/livekit.prod.yaml:/etc/livekit.yaml:ro

  egress:
    volumes:
      - ./infra/egress.prod.yaml:/etc/egress.yaml:ro
      - egress_backup:/out

  transcriber:
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      HF_HOME: /models

  ollama:
    ports:
      - '127.0.0.1:11434:11434'

  ollama-pull:
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    entrypoint: /bin/sh
    command:
      - -c
      - ollama pull "$$OLLAMA_MODEL"
